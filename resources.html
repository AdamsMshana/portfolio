
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My PDF Library</title>
  <link rel="stylesheet" href="css/filestyle.css">
</head>
<body>

  <!-- <header class="header">
    <h1>📚 My PDF Library</h1>
    <p>Click a document to read it online.</p>
  </header> -->

  <main class="layout">
    <aside class="sidebar">
      <h2>Available Documents</h2>
      <input
        type="search"
        id="searchInput"
        placeholder="Search documents..."
        aria-label="Search PDF documents"
      >

      <div id="fileList" class="file-list"></div>
    </aside>

    <section class="viewer">
      <div class="viewer-header">
        <h2 id="fileTitle">Select a PDF document</h2>

        <a
          id="downloadLink"
          class="download-btn"
          href="#"
          download
          hidden
        >Download PDF</a>
      </div>

      <div id="emptyMessage" class="empty-message">
        <div class="big-icon">📄</div>
        <h3>Welcome to the PDF Library</h3>
        <p>Select a document from the left to view it here.</p>
      </div>

      <iframe
        id="pdfViewer"
        title="PDF document viewer"
        hidden
      ></iframe>
    </section>
  </main>

  <footer>
    <p>My PDF Library &copy; </p>
  </footer>

  <script src="js/filescript.js"></script>
</body>
</html>
